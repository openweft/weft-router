name: release

# Publication strictement opt-in : un tag vX.Y.Z ou un dispatch manuel.
# JAMAIS push: main — règle openweft [[feedback-no-autopublish-dev]] :
# pas d'autopublish pendant le dev, les artifacts ne sortent que sur
# action explicite.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: build linux/arm64
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o dist/weft-router-linux-arm64 ./cmd/weft-router
      - name: build linux/amd64
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o dist/weft-router-linux-amd64 ./cmd/weft-router
      - uses: actions/upload-artifact@v4
        with:
          name: weft-router-${{ github.ref_name }}
          path: dist/

  oci:
    # Multi-arch OCI image to GHCR. Consumed by weft-network's
    # lifecycle path (Ensure spawns a micro-VM running this image).
    # Same publish gate as the binaries job — tag or workflow_dispatch.
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/openweft/weft-router
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe needs full history

      - name: Compute version / commit / date
        id: stamps
        run: |
          set -euo pipefail
          VERSION="$(git describe --tags --always --dirty)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # Reproducible-builds.org : derive DATE from the commit
          # timestamp so two runs of the same tag produce the same
          # human-readable stamp.
          EPOCH="$(git log -1 --format=%ct "${GITHUB_SHA}")"
          echo "epoch=${EPOCH}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u -d "@${EPOCH}" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        # Required to cross-build linux/arm64 from the amd64 runner.
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push (multi-arch)
        uses: docker/build-push-action@v5
        env:
          SOURCE_DATE_EPOCH: ${{ steps.stamps.outputs.epoch }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.stamps.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ steps.stamps.outputs.version }}
            COMMIT=${{ steps.stamps.outputs.commit }}
            DATE=${{ steps.stamps.outputs.date }}
            SOURCE_DATE_EPOCH=${{ steps.stamps.outputs.epoch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
