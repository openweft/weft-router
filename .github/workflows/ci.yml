name: ci

# Build + test sur push main et PR — autorisé.
# La publication d'artifacts vit dans release.yml, déclenchée uniquement
# par workflow_dispatch ou tag v* — règle openweft [[feedback-no-autopublish-dev]].
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go vet ./...
      - run: go test ./... -race

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: linux/arm64
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o /tmp/weft-router-arm64 ./cmd/weft-router
      - name: linux/amd64
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o /tmp/weft-router-amd64 ./cmd/weft-router
